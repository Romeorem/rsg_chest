<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>rsg_chest</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="hidden">
        <div class="cryptex" id="cryptex">
            <div class="title" id="title">Coffre</div>
            <div class="step" id="step"></div>
            <div class="timer hidden" id="timer"><span id="timer-bar"></span></div>
            <div class="wheels" id="wheels"></div>
            <div class="msg" id="msg"></div>
            <div class="actions">
                <button class="ghost" id="btn-reset" type="button">Remettre</button>
                <button id="btn-validate" type="button">Valider</button>
            </div>
            <button class="close" id="btn-cancel" type="button" aria-label="Annuler">✕</button>
            <div class="help" id="help"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
